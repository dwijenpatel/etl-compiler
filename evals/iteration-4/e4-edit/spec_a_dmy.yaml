etlspec: 0.1
name: vendor_orders
taxonomy_version: 0.1
source:
  format: csv
  encoding: {value: utf-8, provenance: detected-confirmed}
  dialect: {delimiter: ",", quotechar: '"'}
  header: present
  expected_columns: [order_id, cust_name, amt, dt, active, zip]
target:
  columns:
    - {name: order_id, type: string, nullable: false}
    - {name: customer_name, type: string, nullable: false}
    - {name: amount, type: decimal, scale: 2, nullable: true}
    - {name: order_date, type: date, nullable: true}
    - {name: is_active, type: boolean, nullable: true}
    - {name: postal_code, type: string, nullable: true, max_length: 10}
policies:
  unicode_normalization: {value: NFC, provenance: default}
  strip_control_chars: {value: true, provenance: default}
  normalize_unicode_whitespace: {value: true, provenance: default}
  trim_whitespace: {value: true, provenance: default}
  empty_string_is_null: {value: true, provenance: explicit}
  null_propagation: {value: sql, provenance: default}
  datetime_rendering: {value: iso8601, provenance: default}
  error_disposition: {value: quarantine, provenance: default}
  error_budget: {value: {percent: 25, min_rows: 2}, provenance: explicit}
  duplicate_rows: {value: keep, provenance: default}
mappings:
  - target: order_id
    source: order_id
    transforms: []
    decisions:
      - {id: TYP-07, choice: string, provenance: detected-confirmed, evidence: "uniform 8-digit values"}
  - target: customer_name
    source: cust_name
    transforms: []
  - target: amount
    source: amt
    transforms:
      - {op: to_decimal, thousands_sep: ",", currency: true, accounting_negative: true}
    decisions:
      - {id: TYP-01, choice: "strip $ and commas; (n) = negative", provenance: detected-confirmed}
  - target: order_date
    source: dt
    transforms:
      - {op: to_date, formats: ["%d/%m/%Y"]}
    decisions:
      - {id: TYP-03, choice: MDY, provenance: explicit, evidence: "user confirmed US-format source system"}
    sentinels: {values: ["N/A"], provenance: detected-confirmed}
  - target: is_active
    source: active
    transforms:
      - {op: to_bool, mapping: {Y: true, N: false}}
    decisions:
      - {id: TYP-06, choice: "Y/N vocabulary", provenance: detected-confirmed}
  - target: postal_code
    source: zip
    transforms: []
    decisions:
      - {id: TYP-07, choice: string, provenance: detected-confirmed, evidence: "leading zeros present (02134)"}
unmapped:
  unused_source_columns: []
  unfilled_target_columns: []
review_required: []
