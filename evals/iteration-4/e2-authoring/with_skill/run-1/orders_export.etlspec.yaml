etlspec: 0.4                      # spec format version
name: orders_export               # pipeline name (snake_case, from input filename stem)
taxonomy_version: 0.4             # taxonomy this spec was authored against

# Provenance note (unattended run): the user was away, so no interactive interview
# happened. A desired-output sample (target_orders.csv) was provided and its first
# three rows correspond 1:1 to the first three source rows — it is used here as
# confirmation-by-example for the meaning-changing decisions (dates, mojibake repair,
# sentinels, numeric cleaning, boolean mapping). Decisions the target sample does NOT
# cover (duplicate handling, the ragged row) take the taxonomy house default and are
# listed in review_required.

source:
  format: csv
  encoding: {value: utf-8, provenance: detected-confirmed}   # ENC-01: profiler decoded clean UTF-8
  dialect:
    delimiter: ","                # STR-01
    quotechar: '"'
  header: present                 # STR-04: header present (leading/trailing ws trimmed)
  expected_columns: [order_id, customer, amt, order_date, active, zip, notes]  # KEY-02/03

target:
  columns:                        # ordered; drives output column order (matches target_orders.csv)
    - {name: order_id, type: string, nullable: false}
    - {name: customer_name, type: string, nullable: false}
    - {name: amount, type: decimal, scale: 2, nullable: true}
    - {name: order_date, type: date, nullable: true}
    - {name: is_active, type: boolean, nullable: true}
    - {name: postal_code, type: string, nullable: true, max_length: 10}
    - {name: notes, type: string, nullable: true}

policies:                         # dataset-level; taxonomy IDs in comments
  unicode_normalization: {value: NFC, provenance: default}          # ENC-03
  strip_control_chars: {value: true, provenance: default}           # ENC-04
  normalize_unicode_whitespace: {value: true, provenance: default}  # ENC-05
  trim_whitespace: {value: true, provenance: default}               # NUL-02
  empty_string_is_null: {value: true, provenance: default}          # NUL-01 (output-equivalent for nullable cols; target consistent)
  null_propagation: {value: sql, provenance: default}               # NUL-05
  datetime_rendering: {value: iso8601, provenance: default}         # TYP-05 -> YYYY-MM-DD, matches target
  error_disposition: {value: quarantine, provenance: default}       # ERR-01: never reinterpret; quarantine bad rows
  error_budget: {value: {percent: 5, min_rows: 100}, provenance: default}  # ERR-02
  duplicate_rows: {value: keep, provenance: default}                # STR-05: keep+report (non-destructive default) -- SEE review_required
  formula_injection: {value: pass-through, provenance: default}     # ENC-08: output is warehouse data for machines; no at-risk cells

skip_rows:                        # STR-06: confirmed non-data rows, matched on the RAW value
  - {column: order_id, pattern: '^\D', id: STR-06, reason: "footer/total row", provenance: detected-confirmed}

mappings:                         # one entry per target column
  - target: order_id
    source: order_id
    transforms: []                # not-null enforced by target nullability (nullable: false)
    decisions:
      - {id: TYP-07, choice: string, provenance: detected-confirmed,
         evidence: "uniform 8-digit identifiers; target keeps them as text"}

  - target: customer_name
    source: customer
    transforms:
      - {op: repair_mojibake}     # ENC-06: signature-gated Latin-1->UTF-8 repair; only mis-decoded values touched
    decisions:
      - {id: ENC-06, choice: "repair mojibake", provenance: detected-confirmed,
         evidence: "source 'JosÃ© GarcÃ­a' appears as 'José García' in target sample"}

  - target: amount
    source: amt
    transforms:
      - {op: to_decimal, thousands_sep: ",", currency: true, accounting_negative: true, scale: 2}
    decisions:
      - {id: TYP-01, choice: "strip $ and thousands commas; (n) = negative; scale 2",
         provenance: detected-confirmed,
         evidence: "'$1,234.56'->1234.56, '(500)'->-500.00, '250.00'->250.00 in target sample"}

  - target: order_date
    source: order_date
    transforms:
      - {op: to_date, formats: ["%m/%d/%Y"]}
    decisions:
      - {id: TYP-03, choice: MDY, provenance: detected-confirmed,
         evidence: "ambiguous by content; target sample 01/02->2026-01-02, 03/04->2026-03-04, 05/06->2026-05-06 all resolve MDY -- SEE review_required"}

  - target: is_active
    source: active
    transforms:
      - {op: to_bool, mapping: {Y: true, N: false}}
    decisions:
      - {id: TYP-06, choice: "Y=true / N=false", provenance: detected-confirmed,
         evidence: "target sample Y->true, N->false"}

  - target: postal_code
    source: zip
    transforms: []
    decisions:
      - {id: TYP-07, choice: string, provenance: detected-confirmed,
         evidence: "leading zeros present (02134); target keeps as text; max_length 10"}

  - target: notes
    source: notes
    transforms: []
    sentinels: {values: ["N/A"], provenance: detected-confirmed}     # NUL-03: 'N/A'->null (target row 3 notes is empty)

unmapped:
  unused_source_columns: []       # all 7 source columns are mapped
  unfilled_target_columns: []     # all 7 target columns are filled

review_required:                  # unattended-mode items a human should confirm
  - TYP-03 order_date — MDY inferred from a 3-row target sample only; confirm the source system is US-format before trusting all rows.
  - STR-05 duplicate rows — exact duplicate of order 10000005 is KEPT and reported (house default, non-destructive); set policies.duplicate_rows to drop_exact if dedupe is wanted.
  - STR-02 ragged row — order 10000006 (Carol) has 6 of 7 fields (missing notes) and is QUARANTINED not padded; decide whether a short trailing field should be treated as empty.
