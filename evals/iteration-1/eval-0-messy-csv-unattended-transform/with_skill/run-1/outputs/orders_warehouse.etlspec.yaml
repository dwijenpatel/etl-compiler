etlspec: 0.1
name: orders_warehouse
taxonomy_version: 0.1

# Generated in UNATTENDED MODE (user away from desk). Every meaning-changing
# decision below was derived from evidence in the user-provided desired-output
# sample (target_orders.csv) rather than confirmed in an interview, and is
# marked provenance: unconfirmed. See review_required and NOTES.md.

source:
  format: csv
  encoding: {value: utf-8, provenance: detected-confirmed}   # ENC-01: strict UTF-8 decode succeeds after BOM strip
  dialect:
    delimiter: ","                # STR-01: sniffed, stable field counts
    quotechar: '"'
  header: present                 # STR-04: names carry stray whitespace (" customer ") — trimmed (fix)
  expected_columns: [order_id, customer, amt, order_date, active, zip, notes]   # KEY-02/03 validation list

target:
  # Inferred from target_orders.csv sample; no warehouse DDL was provided, so
  # nullability and max lengths are unverified (see NOTES.md review item R7).
  columns:
    - {name: order_id, type: string, nullable: false}
    - {name: customer_name, type: string, nullable: true}
    - {name: amount, type: decimal, scale: 2, nullable: true}
    - {name: order_date, type: date, nullable: true}
    - {name: is_active, type: boolean, nullable: true}
    - {name: postal_code, type: string, nullable: true}
    - {name: notes, type: string, nullable: true}

policies:                         # dataset-level; taxonomy IDs in comments
  unicode_normalization: {value: NFC, provenance: default}          # ENC-03: decomposed "Réné" -> composed, matches target
  strip_control_chars: {value: true, provenance: default}           # ENC-04: vertical tab in "Bob\x0bSmith" stripped -> "BobSmith" (review item R5)
  normalize_unicode_whitespace: {value: true, provenance: default}  # ENC-05: NBSP in "Ann Lee" -> space
  trim_whitespace: {value: true, provenance: default}               # NUL-02: whitespace-only notes -> empty -> null
  empty_string_is_null: {value: true, provenance: unconfirmed}      # NUL-01: applied to string targets too; target sample renders nulls as empty cells
  null_propagation: {value: sql, provenance: default}               # NUL-05
  datetime_rendering: {value: iso8601, provenance: default}         # TYP-05: matches target sample (2026-01-02)
  error_disposition: {value: quarantine, provenance: default}       # ERR-01
  error_budget: {value: {percent: 5, min_rows: 100}, provenance: default}  # ERR-02
  duplicate_rows: {value: keep, provenance: unconfirmed}            # STR-05: 1 exact duplicate (order_id 10000005) kept and reported (review item R4)
  footer_rows:                                                      # STR-06: row 10 "Total,,3222.56,,,," — quarantined, not silently dropped
    value: "quarantine any row whose order_id equals 'Total' (case-insensitive) with code STR-06"
    provenance: unconfirmed

mappings:                         # one entry per target column
  - target: order_id
    source: order_id
    transforms: []                # clean text + not-null enforced by target nullability (NUL-04)
    decisions:
      - {id: TYP-07, choice: string, provenance: unconfirmed,
         evidence: "uniform 8-digit values in input and target sample; string avoids identifier mangling"}
  - target: customer_name
    source: customer
    transforms:
      - {op: repair_mojibake}     # ENC-06: opt-in repair, this column only
    decisions:
      - {id: ENC-06, choice: repair, provenance: unconfirmed,
         evidence: "input 'JosÃ© GarcÃ­a' appears repaired as 'José García' in target sample row 10000003; taxonomy default is pass-through-and-flag, overridden by target-sample evidence"}
  - target: amount
    source: amt
    transforms:
      - {op: to_decimal, thousands_sep: ",", currency: true, accounting_negative: true, scale: 2}
    decisions:
      - {id: TYP-01, choice: "strip $ and thousands commas; (n) = negative", provenance: unconfirmed,
         evidence: "input '$1,234.56' -> target '1234.56'; input '(500)' -> target '-500.00'"}
      - {id: TYP-08, choice: "decimal, scale 2; excess precision is a row-error (no silent rounding)", provenance: default}
  - target: order_date
    source: order_date
    transforms:
      - {op: to_date, formats: ["%m/%d/%Y"]}
    decisions:
      - {id: TYP-03, choice: MDY, provenance: unconfirmed,
         evidence: "all 6 input values parse as both MDY and DMY; target sample maps 01/02/2026->2026-01-02, 03/04/2026->2026-03-04, 05/06/2026->2026-05-06 — consistent only with MDY. TOP REVIEW ITEM (R1)"}
  - target: is_active
    source: active
    transforms:
      - {op: to_bool, mapping: {Y: true, N: false}}
    decisions:
      - {id: TYP-06, choice: "Y -> true, N -> false", provenance: unconfirmed,
         evidence: "target sample renders Y rows as 'true', N rows as 'false'"}
  - target: postal_code
    source: zip
    transforms: []
    decisions:
      - {id: TYP-07, choice: string, provenance: unconfirmed,
         evidence: "leading zero present (02134) and preserved in target sample"}
  - target: notes
    source: notes
    transforms: []
    sentinels: {values: ["N/A"], provenance: unconfirmed}           # NUL-03
    decisions:
      - {id: NUL-03, choice: "'N/A' -> null", provenance: unconfirmed,
         evidence: "input notes 'N/A' (row 10000003) is an empty cell in target sample"}

unmapped:
  unused_source_columns: []       # all 7 input columns are mapped
  unfilled_target_columns: []     # all 7 target columns are filled

review_required:                  # unconfirmed decisions (unattended mode) — see NOTES.md
  - TYP-03   # MDY date format (R1 — silent-corruption risk if wrong)
  - ENC-06   # mojibake repair on customer (R2)
  - NUL-03   # 'N/A' sentinel in notes (R3)
  - STR-05   # exact duplicate row kept (R4)
  - TYP-01   # amt cleaning rules
  - TYP-06   # Y/N truth mapping
  - TYP-07   # order_id / postal_code as strings
  - NUL-01   # empty -> null for string columns
  - STR-06   # footer 'Total' row quarantined
