etlspec: 0.1
name: partner_shipments
taxonomy_version: "0.2"

# NOTE: Generated in UNATTENDED mode (user unavailable to interview). Every
# ask-class finding below was resolved with the safest option — the one that
# quarantines rather than reinterprets data — and marked provenance: unconfirmed.
# All five are listed in review_required. A human MUST confirm them, edit this
# spec, and regenerate before this pipeline should be trusted to load data.

source:
  format: csv
  encoding: {value: utf-8, provenance: detected-confirmed}        # ENC-01 (strict UTF-8 decode succeeded)
  dialect:
    delimiter: ","                                                 # STR-01 (sniffed, stable field count)
    quotechar: '"'
  header: present                                                  # STR-04
  expected_columns: [ship_id, date, wt, carrier, status]          # KEY-02/03 validation list

target:                                                            # from the CREATE TABLE shipments DDL
  columns:
    - {name: shipment_id, type: string,  nullable: false, max_length: 12}   # VARCHAR(12) NOT NULL
    - {name: ship_date,   type: date,    nullable: true}                    # DATE
    - {name: weight_kg,   type: decimal, nullable: true, precision: 8, scale: 2}  # DECIMAL(8,2)
    - {name: carrier,     type: string,  nullable: true, max_length: 20}    # VARCHAR(20)
    - {name: delivered,   type: boolean, nullable: true}                    # BOOLEAN

policies:
  unicode_normalization: {value: NFC, provenance: default}          # ENC-03
  strip_control_chars: {value: true, provenance: default}           # ENC-04
  normalize_unicode_whitespace: {value: true, provenance: default}  # ENC-05
  trim_whitespace: {value: true, provenance: default}               # NUL-02 (e.g. " 8.25 " in wt)
  empty_string_is_null: {value: true, provenance: unconfirmed}      # NUL-01 (see review_required)
  null_propagation: {value: sql, provenance: default}               # NUL-05
  datetime_rendering: {value: iso8601, provenance: default}         # TYP-05
  error_disposition: {value: quarantine, provenance: default}       # ERR-01
  error_budget: {value: {percent: 5, min_rows: 100}, provenance: default}  # ERR-02
  duplicate_rows: {value: keep, provenance: default}                # STR-05
  sentinels: {}                                                     # NUL-03 handled per-mapping as quarantine, NOT null-substitution

mappings:
  - target: shipment_id
    source: ship_id
    transforms:
      - {op: check_length, max_length: 12}                          # TYP-11 (VARCHAR(12))
    # not-null enforced by target nullable:false -> NUL-04 at runtime
    decisions:
      - {id: NUL-01, choice: "empty ship_id -> null -> NUL-04 quarantine (do not load a blank key)",
         provenance: unconfirmed, evidence: "1 empty ship_id value in sample (row 7)"}

  - target: ship_date
    source: date
    transforms:
      - {op: to_date, formats: []}                                  # TYP-03: format list intentionally EMPTY
    decisions:
      - {id: TYP-03, choice: "UNRESOLVED (MDY vs DMY) -> quarantine every value until confirmed",
         provenance: unconfirmed,
         evidence: "all 8 sample dates parse as BOTH MDY and DMY (every day and month component <=12); zero disambiguating evidence. Guessing silently corrupts every row."}

  - target: weight_kg
    source: wt
    transforms:
      - {op: expr, python: "quarantine wt=='9999' as NUL-03 sentinel", note: "see transform_row guard"}
      - {op: to_decimal, scale: 2}                                  # TYP-08 (DECIMAL(8,2); over-scale values are row-errors, never silently rounded)
    decisions:
      - {id: NUL-03, choice: "wt == 9999 -> quarantine (row-error). NOT nulled (may be a real weight), NOT loaded as data (suspected sentinel).",
         provenance: unconfirmed, evidence: "'9999' appears 3x in wt (rows 3,5,8) amid values 3.75-140.00 kg — glaring sentinel-shaped constant"}

  - target: carrier
    source: carrier
    transforms:
      - {op: check_length, max_length: 20}                          # TYP-11 (VARCHAR(20))
    decisions:
      - {id: TYP-10, choice: "PRESERVE raw case (UPS/Ups/ups, FEDEX/FedEx) — do NOT canonicalize",
         provenance: unconfirmed,
         evidence: "case collisions: ups={UPS,Ups,ups}, fedex={FEDEX,FedEx}. Canonicalizing picks a form; preserving reinterprets nothing."}

  - target: delivered
    source: status
    transforms:
      - {op: to_bool, mapping: {Y: true, N: false}}                 # TYP-06
    decisions:
      - {id: TYP-06, choice: "Y->true, N->false (standard, low-risk); out-of-vocabulary values are row-errors",
         provenance: unconfirmed, evidence: "status vocabulary = {Y, N}"}

unmapped:
  unused_source_columns: []          # all 5 source columns mapped
  unfilled_target_columns: []        # all 5 target columns filled

# Every ask-class decision made without user confirmation. A human must review each.
review_required:
  - {id: TYP-03, column: date,    why: "date format MDY vs DMY is unconfirmed; NOTHING loads until a human declares it. This is the highest-priority item."}
  - {id: NUL-03, column: wt,      why: "does 9999 mean 'missing weight' (->null) or a real 9999 kg, or bad data? Currently quarantined pending decision."}
  - {id: NUL-01, column: ship_id, why: "empty ship_id treated as null (-> NUL-04 quarantine). Confirm blank keys should be rejected, not loaded as ''."}
  - {id: TYP-06, column: status,  why: "Y->true / N->false assumed. Confirm truth mapping and whether other values can appear."}
  - {id: TYP-10, column: carrier, why: "carrier case is inconsistent and preserved as-is. Decide whether to canonicalize (e.g. all -> UPS/FedEx)."}
