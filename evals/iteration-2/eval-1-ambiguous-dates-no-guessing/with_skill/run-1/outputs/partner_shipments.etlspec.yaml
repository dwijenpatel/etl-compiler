  # as null routes it into the NOT NULL check (NUL-04) -> quarantine, rather than
  # loading "" as a shipment id. Ask-class for a string target; chosen unattended.
  empty_string_is_null: {value: true, provenance: unconfirmed}      # NUL-01
  null_propagation: {value: sql, provenance: default}               # NUL-05
  datetime_rendering: {value: iso8601, provenance: default}         # TYP-05
