etlspec: 0.1
name: orders_export
taxonomy_version: 0.1

# Authored in UNATTENDED mode (user away from desk). Ambiguous, meaning-changing
# (`ask`-class) decisions were resolved against the supplied desired-output sample
# (eval-inputs/target_orders.csv). Every decision that a human should still confirm
# is marked `provenance: unconfirmed` and listed in `review_required` at the bottom.

source:
  format: csv
  encoding: {value: utf-8, provenance: detected-confirmed}   # ENC-01: decodes cleanly as UTF-8
  dialect:
    delimiter: ","                                            # STR-01
    quotechar: '"'
  header: present                                             # STR-04: header " customer " trimmed by runtime (fix)
  expected_columns: [order_id, customer, amt, order_date, active, zip, notes]  # KEY-02/03

target:
  columns:                                                    # ordered; drives output column order
    - {name: order_id, type: string, nullable: false}
    - {name: customer_name, type: string, nullable: false}
    - {name: amount, type: decimal, scale: 2, nullable: true}
    - {name: order_date, type: date, nullable: true}
    - {name: is_active, type: boolean, nullable: true}
    - {name: postal_code, type: string, nullable: true, max_length: 10}
    - {name: notes, type: string, nullable: true}

policies:                                                     # dataset-level; taxonomy IDs in comments
  unicode_normalization: {value: NFC, provenance: default}          # ENC-03
  strip_control_chars: {value: true, provenance: default}           # ENC-04
  normalize_unicode_whitespace: {value: true, provenance: default}  # ENC-05
  trim_whitespace: {value: true, provenance: default}               # NUL-02
  empty_string_is_null: {value: true, provenance: unconfirmed}      # NUL-01: output-invariant for CSV here; see review
  null_propagation: {value: sql, provenance: default}               # NUL-05
  datetime_rendering: {value: iso8601, provenance: default}         # TYP-05: matches target (YYYY-MM-DD)
  error_disposition: {value: quarantine, provenance: default}       # ERR-01
  error_budget: {value: {percent: 5, min_rows: 100}, provenance: default}  # ERR-02 (won't engage on a 9-row file)
  duplicate_rows: {value: keep, provenance: default}                # STR-05: keep-and-report exact duplicates
  sentinels:                                                        # NUL-03: per-column, always with evidence
    notes:
      values: ["N/A"]
      provenance: detected-confirmed
      evidence: "target maps row 3 notes 'N/A' -> empty/null"

mappings:                                                     # one entry per target column
  - target: order_id
    source: order_id
    transforms: []                                            # kept as string; not-null enforced by nullable:false
    decisions:
      - {id: TYP-07, choice: string, provenance: detected-confirmed,
         evidence: "uniform 8-digit ids; target preserves 10000001 verbatim"}

  - target: customer_name
    source: customer                                          # source header " customer " trimmed by runtime (STR-04)
    transforms:
      - {op: repair_mojibake}                                 # ENC-06: opt-in mojibake repair
    decisions:
      - {id: ENC-06, choice: "repair double-encoded UTF-8", provenance: unconfirmed,
         evidence: "'JosÃ© GarcÃ­a' in 1 row; target shows repaired 'José García'. Heuristic; confirm."}

  - target: amount
    source: amt
    transforms:
      - {op: to_decimal, thousands_sep: ",", currency: true, accounting_negative: true, scale: 2}
    decisions:
      - {id: TYP-01, choice: "strip $/commas; (n) = negative", provenance: detected-confirmed,
         evidence: "$1,234.56 and (500) in source; target renders 1234.56 and -500.00"}

  - target: order_date
    source: order_date
    transforms:
      - {op: to_date, formats: ["%m/%d/%Y"]}
    decisions:
      - {id: TYP-03, choice: MDY, provenance: detected-confirmed,
         evidence: "ambiguous in source; target 01/02/2026->2026-01-02, 03/04->03-04, 05/06->05-06 all confirm MDY"}

  - target: is_active
    source: active
    transforms:
      - {op: to_bool, mapping: {Y: true, N: false}}
    decisions:
      - {id: TYP-06, choice: "Y/N vocabulary", provenance: detected-confirmed,
         evidence: "target Y->true, N->false"}

  - target: postal_code
    source: zip
    transforms: []                                            # length checked against max_length (TYP-11)
    decisions:
      - {id: TYP-07, choice: string, provenance: detected-confirmed,
         evidence: "leading zeros present (02134); target preserves them"}

  - target: notes
    source: notes
    transforms: []                                            # 'N/A' sentinel + empty/whitespace -> null (see policies)
    decisions:
      - {id: NUL-03, choice: "'N/A' -> null", provenance: detected-confirmed,
         evidence: "target row 3 notes 'N/A' -> empty"}

# Non-data rows handled in the pipeline as explicit, counted exclusions (never silent):
#   STR-06 footer: the "Total,,3222.56,,,," row (7 fields, so not ragged) is skipped
#                  via SkipRow when order_id == "Total".
#   STR-06 blank:  the fully-blank row is skipped and counted by the runtime.
#   STR-02 ragged: the 6-field "10000006,Carol,..." row (missing notes) is quarantined
#                  by default rather than padded (padding would invent a notes value).
#   STR-05 dup:    the repeated 10000005 row is kept and reported (duplicate_rows: keep).

unmapped:
  unused_source_columns: []                                   # all 7 source columns map to a target
  unfilled_target_columns: []

review_required:                                              # confirm these when back at the desk
  - id: ENC-06
    column: customer_name
    note: >
      Mojibake repair was turned ON to match the target sample ('JosÃ© GarcÃ­a' ->
      'José García'). Repair is heuristic and only 1 example was seen. Confirm the
      full export contains only genuinely double-encoded values, not legitimately
      accented text that happens to trip the signature.
  - id: TYP-03
    column: order_date
    note: >
      Date format read as MDY (month/day/year) — inferred from the target sample only.
      All source dates have day<=12 so they are ambiguous on their own. Confirm the
      vendor's source system is US-format before trusting historical loads.
  - id: STR-06
    column: order_id
    note: >
      The "Total" footer row is skipped by matching order_id == "Total". If future
      exports use a different footer marker (or none), this rule silently stops firing;
      confirm the footer convention.
  - id: STR-02
    column: <row>
    note: >
      The short "10000006,Carol,..." row (missing the notes field) is quarantined,
      not padded. If a missing trailing notes should instead become an empty/null note,
      change the disposition — but that is inventing data, so it needs a human decision.
  - id: NUL-01
    column: <dataset>
    note: >
      empty_string_is_null=true was assumed. For CSV output it is output-invariant here
      (both render as an empty field), but confirm the warehouse's empty-vs-null intent.
