etlspec: 0.1
name: orders
taxonomy_version: "0.2"

# Vendor export -> warehouse orders format.
# Authored in UNATTENDED mode (user away). Meaning-changing ambiguities were
# resolved against the provided desired-output sample (target_orders.csv), which
# demonstrates the intended transform for the first 3 rows. Items that could not
# be confirmed from that sample are marked `unconfirmed` and listed in
# `review_required` below.

source:
  format: csv
  encoding: {value: utf-8, provenance: detected-confirmed}   # ENC-01: profiler decoded clean as utf-8 (with BOM)
  dialect:
    delimiter: ","                                            # STR-01
    quotechar: '"'
  header: present                                             # STR-04 (leading/trailing ws in " customer " trimmed)
  expected_columns: [order_id, customer, amt, order_date, active, zip, notes]   # KEY-02/03; post-trim header names

target:
  columns:                                                    # ordered; drives output column order (matches target_orders.csv)
    - {name: order_id, type: string, nullable: false}
    - {name: customer_name, type: string, nullable: false}
    - {name: amount, type: decimal, scale: 2, nullable: true}
    - {name: order_date, type: date, nullable: true}
    - {name: is_active, type: boolean, nullable: true}
    - {name: postal_code, type: string, nullable: true, max_length: 10}
    - {name: notes, type: string, nullable: true}

policies:                                                     # dataset-level; taxonomy IDs in comments
  unicode_normalization: {value: NFC, provenance: default}          # ENC-03
  strip_control_chars: {value: true, provenance: default}           # ENC-04 (strips the vertical-tab in "Bob\x0bSmith")
  normalize_unicode_whitespace: {value: true, provenance: default}  # ENC-05 (maps the NBSP in "Ann\xa0Lee" -> space)
  repair_mojibake: {value: true, provenance: detected-confirmed}    # ENC-06 (opt-in; target shows "JosÃ©"->"José") — see review_required
  trim_whitespace: {value: true, provenance: default}               # NUL-02
  empty_string_is_null: {value: true, provenance: default}          # NUL-01 (string columns; empties render as empty either way)
  null_propagation: {value: sql, provenance: default}               # NUL-05
  datetime_rendering: {value: iso8601, provenance: default}         # TYP-05
  error_disposition: {value: quarantine, provenance: default}       # ERR-01
  error_budget: {value: {percent: 5, min_rows: 100}, provenance: default}  # ERR-02
  duplicate_rows: {value: keep, provenance: default}                # STR-05: keep + report (the dup 10000005 row is kept)
  footer_keywords: {value: [total, totals, subtotal, "grand total", sum], provenance: unconfirmed}  # STR-06 — see review_required
  sentinels:
    notes: {values: ["N/A"], provenance: detected-confirmed}        # NUL-03 (target row 3 blanks the "N/A" note)

mappings:                                                     # one entry per target column
  - target: order_id
    source: order_id
    transforms: []                                            # kept as string; not-null enforced by target nullability
    decisions:
      - {id: TYP-07, choice: string, provenance: detected-confirmed,
         evidence: "8-digit order identifiers; kept as text to avoid precision/format loss"}

  - target: customer_name
    source: customer
    transforms:
      - {op: repair_mojibake}                                 # ENC-06
    decisions:
      - {id: ENC-06, choice: "repair double-encoded UTF-8", provenance: detected-confirmed,
         evidence: "target_orders.csv row 3: source 'JosÃ© GarcÃ­a' -> 'José García'"}
      - {id: ENC-03, choice: "NFC", provenance: default,
         evidence: "'Réné' arrives decomposed (e + U+0301); normalized to composed"}

  - target: amount
    source: amt
    transforms:
      - {op: to_decimal, thousands_sep: ",", currency: true, accounting_negative: true, scale: 2}
    decisions:
      - {id: TYP-01, choice: "strip $ and thousands commas; (n) = negative; scale 2",
         provenance: detected-confirmed,
         evidence: "target: '$1,234.56'->1234.56, '(500)'->-500.00, '250.00'->250.00"}

  - target: order_date
    source: order_date
    transforms:
      - {op: to_date, formats: ["%m/%d/%Y"]}
    decisions:
      - {id: TYP-03, choice: MDY, provenance: detected-confirmed,
         evidence: "profiler: all 6 values ambiguous MDY/DMY; target resolves '01/02/2026'->'2026-01-02' (MDY)"}

  - target: is_active
    source: active
    transforms:
      - {op: to_bool, mapping: {Y: true, N: false}}
    decisions:
      - {id: TYP-06, choice: "Y=true, N=false", provenance: detected-confirmed,
         evidence: "target: Y->true, N->false"}

  - target: postal_code
    source: zip
    transforms:
      - {op: check_length, max_length: 10}
    decisions:
      - {id: TYP-07, choice: string, provenance: detected-confirmed,
         evidence: "leading zeros present (02134); kept as text and preserved in target"}

  - target: notes
    source: notes
    transforms: []                                            # text clean + N/A sentinel -> null (applied pre-transform)
    decisions:
      - {id: NUL-03, choice: "N/A -> null", provenance: detected-confirmed,
         evidence: "target row 3 notes is empty where source is 'N/A'"}

unmapped:
  unused_source_columns: []                                   # all 7 source columns are mapped
  unfilled_target_columns: []                                 # all 7 target columns are filled

# Unconfirmed decisions made in unattended mode. Confirm these when back at desk:
review_required:
  - id: TYP-03
    note: "Date format read as MDY (US). Confirmed by the 3-row target sample, but every
           sample value is ambiguous (both parts <= 12). Confirm the source system is US-format
           before trusting all rows — a wrong MDY/DMY call silently corrupts every date."
  - id: ENC-06
    note: "Mojibake repair is ON (taxonomy default is OFF/opt-in). Enabled because the target
           requires 'JosÃ©'->'José'. Repair only touches values with the double-encode signature
           that round-trip cleanly; all other names pass through untouched. Runtime note: the
           shared etl_runtime.py copy gained a `repair_mojibake` function (ENC-06) — this is a
           local addition, not present in the skill's shipped runtime."
  - id: STR-06
    note: "The 'Total,,3222.56,,,,' footer row is excluded via an explicit SkipRow on footer
           keywords (order_id in {total, subtotal, ...}). Confirm no real order_id is a keyword."
  - id: STR-05
    note: "One exact-duplicate row (order_id 10000005) is KEPT and reported (house default), not
           dropped. If the warehouse expects de-duplication, set duplicate_rows: drop_exact."
  - id: ENC-04
    note: "'Bob\\x0bSmith' has an embedded vertical-tab control char; house default strips it ->
           'BobSmith' (no space inserted). If a space was intended, that is ENC-04 option (b)."
