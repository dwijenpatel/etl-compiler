etlspec: 0.1
name: orders_export
taxonomy_version: 0.2

# Source: vendor CSV export (orders_export.csv). Target: warehouse format,
# ground-truthed against the provided sample target_orders.csv.
#
# Authored in UNATTENDED mode (user away). Every ask-class finding from the
# profiler was resolved against the target sample, which is authoritative for
# the transform. Items I could NOT confirm from the target are listed in
# review_required below.

source:
  format: csv
  encoding: {value: utf-8, provenance: detected-confirmed}   # ENC-01; UTF-8 BOM stripped (ENC-02)
  dialect: {delimiter: ",", quotechar: '"'}
  header: present                                             # STR-04: header names carry stray
                                                              # whitespace (" customer "); trimmed
  expected_columns: [order_id, customer, amt, order_date, active, zip, notes]

target:
  columns:
    - {name: order_id, type: string, nullable: false}
    - {name: customer_name, type: string, nullable: false}
    - {name: amount, type: decimal, scale: 2, nullable: true}
    - {name: order_date, type: date, nullable: true}
    - {name: is_active, type: boolean, nullable: true}
    - {name: postal_code, type: string, nullable: true, max_length: 10}
    - {name: notes, type: string, nullable: true}

policies:
  unicode_normalization: {value: NFC, provenance: default}          # ENC-03
  strip_control_chars: {value: true, provenance: default}           # ENC-04
  normalize_unicode_whitespace: {value: true, provenance: default}  # ENC-05
  trim_whitespace: {value: true, provenance: default}               # NUL-02
  empty_string_is_null: {value: true, provenance: default}          # NUL-01 (null vs "" is
                                                                     # indistinguishable in CSV output)
  null_propagation: {value: sql, provenance: default}               # NUL-05
  datetime_rendering: {value: iso8601, provenance: default}         # TYP-05
  error_disposition: {value: quarantine, provenance: default}       # ERR-01
  error_budget: {value: {percent: 25, min_rows: 2}, provenance: explicit}  # loosened for the
                                                                     # tiny 9-row sample
  duplicate_rows: {value: keep, provenance: default}                # STR-05: keep-and-report

# Row-level exclusions (STR-06). NOTE: not part of the compiler's spec subset,
# so this pipeline was hand-generated (see pipeline header). Documented here
# because the spec is the source of truth for behavior.
row_filters:
  - {id: STR-06, rule: "drop rows whose order_id is non-numeric (footer/total rows)",
     provenance: detected-confirmed,
     evidence: "row 'Total,,3222.56,,,,' is an aggregate footer; target has no such row"}

mappings:
  - target: order_id
    source: order_id
    transforms: []
    decisions:
      - {id: TYP-07, choice: string, provenance: detected-confirmed,
         evidence: "uniform 8-digit ids; target preserves them verbatim"}
  - target: customer_name
    source: customer
    transforms:
      - {op: repair_mojibake}                                       # ENC-06 (runtime fn)
    decisions:
      - {id: ENC-06, choice: "repair (guarded latin-1->utf-8 round-trip)",
         provenance: detected-confirmed,
         evidence: "target renders 'JosÃ© GarcÃ­a' as 'José García'; 'José'/'Réné' left intact"}
  - target: amount
    source: amt
    transforms:
      - {op: to_decimal, thousands_sep: ",", currency: true, accounting_negative: true, scale: 2}
    decisions:
      - {id: TYP-01, choice: "strip $ and thousands commas; (n) = negative; scale 2",
         provenance: detected-confirmed,
         evidence: "'$1,234.56'->1234.56, '(500)'->-500.00, '250.00'->250.00 in target"}
  - target: order_date
    source: order_date
    transforms:
      - {op: to_date, formats: ["%m/%d/%Y"]}
    decisions:
      - {id: TYP-03, choice: MDY, provenance: detected-confirmed,
         evidence: "target renders 01/02->2026-01-02, 03/04->2026-03-04, 05/06->2026-05-06 (month first)"}
  - target: is_active
    source: active
    transforms:
      - {op: to_bool, mapping: {Y: true, N: false}}
    decisions:
      - {id: TYP-06, choice: "Y=true, N=false", provenance: detected-confirmed,
         evidence: "target row1 Y->true, row2 N->false"}
  - target: postal_code
    source: zip
    transforms: []
    decisions:
      - {id: TYP-07, choice: string, provenance: detected-confirmed,
         evidence: "leading zeros present (02134) and preserved in target"}
  - target: notes
    source: notes
    transforms: []
    sentinels: {values: ["N/A"], provenance: detected-confirmed}    # NUL-03
    decisions:
      - {id: NUL-03, choice: "'N/A' means null", provenance: detected-confirmed,
         evidence: "source notes 'N/A' -> empty cell in target"}

unmapped:
  unused_source_columns: []
  unfilled_target_columns: []

# Confirmed against the target sample, but flagged because they are meaning-changing
# or unverifiable from a 3-row sample. Please review when back at your desk.
review_required:
  - {id: TYP-03, note: "Dates read as US MM/DD/YYYY; all sample values have both parts <=12 so only the target field order proves MDY. Confirm source is US-locale. Non-matching dates are quarantined, never reinterpreted."}
  - {id: STR-02, note: "Row 6 (order 10000006, Carol) has 6 fields (missing trailing notes) -> quarantined per house default. If the export legitimately drops empty trailing fields, treat missing notes as empty instead."}
  - {id: STR-05, note: "Order 10000005 (BobSmith) appears twice (exact duplicate) -> both kept and reported per house default. Confirm whether the warehouse wants duplicates kept or de-duped."}
