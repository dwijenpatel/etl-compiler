[project]
name = "etl-solved"
version = "0.5.0"
description = "Dev tooling for the etl-solved repo (the shipped skill itself is stdlib-only; nothing here is a runtime dependency)"
requires-python = ">=3.10"

[dependency-groups]
dev = ["mypy>=1.14"]

# ---------------------------------------------------------------------------
# Type checking. The gate is tests/test_typecheck.py (part of the unittest
# suite). Strictness is a ratchet:
#   - runtime (assets/*) + compiler (compile_spec): mypy --strict — the typed
#     YAML loader (YamlValue/Line) and SpecDict contracts live in the compiler;
#     validate-then-cast marks every checked boundary.
#   - profiler + tests: default level with untyped bodies checked; the profiler
#     is the remaining ratchet rung.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
mypy_path = [
    "skill/etl-generator/assets",
    "skill/etl-generator/scripts",
]
files = [
    "skill/etl-generator/assets",
    "skill/etl-generator/scripts",
    "tests",
]
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# mypy's `strict` flag is global-only; per-module it must be spelled out.
# This block IS --strict for the runtime modules (mypy --strict component flags).
[[tool.mypy.overrides]]
module = ["etl_runtime", "etl_coercers", "compile_spec"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
