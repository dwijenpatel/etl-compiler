[project]
name = "etl-compiler"
version = "0.5.0"
description = "Dev tooling for the etl-compiler repo (the shipped skill itself is stdlib-only; nothing here is a runtime dependency)"
requires-python = ">=3.10"

[dependency-groups]
dev = ["mypy>=1.14"]

# ---------------------------------------------------------------------------
# Type checking. The gate is tests/test_typecheck.py (part of the unittest
# suite). ALL product modules are strict (the ratchet is fully closed):
#   - runtime (etl_coercers/etl_runtime): CellValue + config/record TypedDicts
#   - compiler (compile_spec): typed YAML loader (YamlValue/Line) + SpecDict
#     contracts; validate-then-cast marks every checked boundary
#   - profiler (profile): Finding/InterviewGroup/ProfileResult contracts
#     (functional TypedDict syntax — "class"/"row-error" are contract keys)
#   - tests: default level with untyped bodies checked (deliberate: test
#     ergonomics over annotation ceremony; the product surface is the bar).
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
mypy_path = [
    "skill/etl-generator/assets",
    "skill/etl-generator/scripts",
]
files = [
    "skill/etl-generator/assets",
    "skill/etl-generator/scripts",
    "tests",
]
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# mypy's `strict` flag is global-only; per-module it must be spelled out.
# This block IS --strict for the runtime modules (mypy --strict component flags).
[[tool.mypy.overrides]]
module = ["etl_runtime", "etl_coercers", "compile_spec", "profile"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
